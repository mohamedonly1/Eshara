<!DOCTYPE html>
<html lang="{{ active_lang }}" dir="{{ 'rtl' if active_lang == 'ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ t('title_collect') }}</title>
    <link rel="stylesheet" href="/static/ishara-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:#0a0a0f; --surface:#13131a; --surface2:#1c1c28;
            --accent:#00d4aa; --warn:#f59e0b; --danger:#ef4444;
            --text:#f0f0f8; --text-dim:#6b7280; --radius:14px;
            --navbar: 52px;
        }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; overflow: hidden; }

        /* الصفحة كلها تحت الـ navbar */
        .page-content {
            padding-top: var(--navbar);
            height: 100dvh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Collapsible letter panel — fixed at bottom on all screen sizes */
.letter-selector {
            background: var(--surface);
            border-top: 1px solid rgba(0,0,0,0.08);
            z-index: 10;
        }

        .letter-selector.collapsed .letters-grid,
        .letter-selector.collapsed .letter-dropdown {
            display: none;
        }

        .selector-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .selector-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            margin: 0;
        }

        .selector-toggle-icon {
            font-size: 14px;
            color: var(--text-dim);
            transition: transform 0.3s;
        }

        .letter-selector.collapsed .selector-toggle-icon {
            transform: rotate(180deg);
        }

        .letters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(42px, 1fr));
            gap: 6px;
            padding: 6px 12px 16px;
            max-height: 40vh;
            overflow-y: auto;
        }

        /* hide the old select dropdown — not needed anymore */
        .letter-dropdown {
            display: none !important;
        }
        .letter-btn {
            aspect-ratio: 1;
            border-radius: 7px;
            border: 1px solid rgba(255,255,255,0.08);
            background: var(--surface2);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            line-height: 1;
        }
        .letter-btn:active { transform: scale(0.88); }
        .letter-btn.selected { background: var(--accent); color: #000; border-color: var(--accent); }
        .letter-btn.complete { background: rgba(0,212,170,0.12); border-color: rgba(0,212,170,0.3); color: var(--accent); }
        .letter-count { font-size: 6px; opacity: 0.65; margin-top: 1px; }

        /* الكاميرا تملأ باقي المساحة */
.camera-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            min-height: 0;
        }
        #video { width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); display: block; }
        #overlay { position: absolute; inset: 0; transform: scaleX(-1); pointer-events: none; }

       /* ══════════════════════════════════════════════════════
             إصلاح زوايا إطار التركيز لتطابق فريم الكاميرا
        ══════════════════════════════════════════════════════ */

    /* الإعدادات العامة للزوايا */
    .bracket { 
        position: absolute; 
        width: 25px; 
        height: 25px; 
        border-color: var(--warn); 
        border-style: solid; 
        opacity: 0.8; 
        z-index: 5;
        transition: all 0.3s;
    }

    /* الزاوية العلوية اليمنى (Top Right) */
    .bracket.tl { 
        top: 0; 
        right: 0; 
        border-width: 3px 3px 0 0; /* رسم الضلع العلوي والأيمن */
        border-radius: 0 8px 0 0; 
    }

    /* الزاوية العلوية اليسرى (Top Left) */
    .bracket.tr { 
        top: 0; 
        left: 0; 
        border-width: 3px 0 0 3px; /* رسم الضلع العلوي والأيسر */
        border-radius: 8px 0 0 0; 
    }

    /* الزاوية السفلية اليمنى (Bottom Right) */
    .bracket.bl { 
        bottom: 0; 
        right: 0; 
        border-width: 0 3px 3px 0; /* رسم الضلع السفلي والأيمن */
        border-radius: 0 0 8px 0; 
    }

    /* الزاوية السفلية اليسرى (Bottom Left) */
    .bracket.br { 
        bottom: 0; 
        left: 0; 
        border-width: 0 0 3px 3px; /* رسم الضلع السفلي والأيسر */
        border-radius: 0 0 0 8px; 
    }
        /* حالة اليد - فوق الكاميرا مش تحت الـ navbar */
        .hand-status {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid rgba(255,255,255,0.1);
            white-space: nowrap;
            transition: all 0.3s;
            z-index: 10;
        }
        .hand-status.detected { border-color: rgba(0,212,170,0.5); color: var(--accent); }

        /* رسالة الرفض - داخل الكاميرا */
        .reject-msg {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(239,68,68,0.9);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            opacity: 0;
            transition: all 0.3s;
            z-index: 10;
            pointer-events: none;
        }
        .reject-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* البانل السفلي داخل الكاميرا */
/* البانل السفلي */
        .bottom-panel {
            background: var(--surface);
            padding: 10px 14px 12px;
            border-top: 1px solid rgba(0,0,0,0.08);
            z-index: 10;
        }

        .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
        .progress-letter { font-size: 38px; font-weight: 900; color: var(--warn); min-width: 46px; text-align: center; line-height: 1; }
        .progress-info { flex: 1; }
        .progress-nums { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
        .progress-nums span:last-child { color: var(--accent); font-weight: 700; }
        .progress-track { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--warn), var(--accent)); border-radius: 3px; transition: width 0.3s; }

        .auto-bar-wrap { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
        .auto-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.08s linear; width: 0%; }

        .btns-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
        .record-btn {
            padding: 12px;
            border-radius: var(--radius);
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            background: linear-gradient(135deg, var(--warn), #f97316);
            color: #000;
        }
        .record-btn:active { transform: scale(0.97); }
        .record-btn:disabled { background: var(--surface2); color: var(--text-dim); cursor: not-allowed; }
        .record-btn.success { background: linear-gradient(135deg, var(--accent), #059669); color: #000; }

        .auto-toggle {
            min-width: 68px;
            padding: 12px 6px;
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--surface2);
            color: var(--text-dim);
            font-family: 'Cairo', sans-serif;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        .auto-toggle.active { background: rgba(0,212,170,0.15); border-color: var(--accent); color: var(--accent); }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(0,212,170,0.3);
            color: var(--accent);
            transition: all 0.3s;
            z-index: 200;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Loading */
        .loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; transition: opacity 0.5s; }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }

        .spinner { width: 28px; height: 28px; border: 3px solid var(--surface2); border-top-color: var(--warn); border-radius: 50%; animation: spin 0.8s linear infinite; margin-top: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00d4aa">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="إشارة">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body>
{% include 'navbar.html' %}

<div class="loading-screen" id="loadingScreen">
    <div style="font-size:36px"></div>
    <div style="font-size:18px;font-weight:900;margin-top:10px;color:#f59e0b">{{ t('title_collect') }}</div>
    <div style="font-size:12px;color:#6b7280;margin-top:6px" id="loadingSub">{{ t('loading_mediapipe') }}</div>
    <div class="spinner"></div>
</div>

<div class="toast" id="toast"></div>
<div class="page-content layout-collect">
    <div class="camera-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
        <div class="hand-status" id="handStatus">{{ t('waiting_for_hand_dots') }}</div>
        <div class="reject-msg" id="rejectMsg"></div>
    </div> <div class="letter-selector collapsed" id="letterSelector">
        <div class="selector-toggle" onclick="toggleLetterPanel()">
            <span class="selector-label">{{ t('select_letter_to_record') }}</span>
            <span class="selector-toggle-icon">▲</span>
        </div>
        <div class="letters-grid" id="lettersGrid"></div>
    </div>

    <div class="bottom-panel">
        <div class="progress-row">
            <div class="progress-letter" id="currentLetterDisplay">—</div>
            <div class="progress-info">
                <div class="progress-nums">
                    <span id="progressLabel">{{ t('choose_letter_first') }}</span>
                    <span id="progressCount">0/200</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width:0%"></div>
                </div>
            </div>
        </div>
        <div class="auto-bar-wrap">
            <div class="auto-bar" id="autoBar"></div>
        </div>
        <div class="btns-row">
            <button class="record-btn" id="recordBtn" onclick="recordSample()" disabled>{{ t('choose_letter_first') }}</button>
            <button class="auto-toggle" id="autoToggle" onclick="toggleAuto()"><br>{{ t('auto_mode') }}</button>
        </div>
    </div>
</div>

<script>
const TARGET_SAMPLES = 200;
const AUTO_CONFIRM_FRAMES = 5;
const ARABIC_LETTERS = {{ letters | tojson | safe }};

let selectedLetter = null;
let selectedIdx = null;
let sampleCounts = {};
let autoMode = false;
let autoFrameCount = 0;
let isRecording = false;
let currentLandmarks = null;

const video = document.getElementById('video');
const overlayCanvas = document.getElementById('overlay');
const overlayCtx = overlayCanvas.getContext('2d');
const cameraWrap = document.querySelector('.camera-wrap');

// ===== شبكة الحروف =====
function toggleLetterPanel() {
    document.getElementById('letterSelector').classList.toggle('collapsed');
}

function buildLettersGrid() {
    const grid = document.getElementById('lettersGrid');

    ARABIC_LETTERS.forEach((letter, idx) => {
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.id = 'lbtn_' + idx;
        btn.innerHTML = letter + '<span class="letter-count" id="lcount_' + idx + '">0</span>';
        btn.onclick = () => selectLetter(idx, letter);
        grid.appendChild(btn);
    });
}

async function loadCounts() {
    try {
        const res = await fetch('/sample_counts');
        const data = await res.json();
        sampleCounts = data.counts || {};
        updateAllCounts();
    } catch(e) {}
}

function updateAllCounts() {
    ARABIC_LETTERS.forEach((_, idx) => {
        const count = sampleCounts[idx] || 0;
        const countEl = document.getElementById('lcount_' + idx);
        const btnEl = document.getElementById('lbtn_' + idx);
        if (countEl) countEl.textContent = count >= TARGET_SAMPLES ? '✓' : count;
        if (btnEl) btnEl.classList.toggle('complete', count >= TARGET_SAMPLES);
    });
}

function selectLetter(idx, letter) {
    if (selectedIdx !== null) document.getElementById('lbtn_' + selectedIdx)?.classList.remove('selected');
    selectedIdx = idx;
    selectedLetter = letter;
    document.getElementById('lbtn_' + idx).classList.add('selected');
    document.getElementById('currentLetterDisplay').textContent = letter;
    const count = sampleCounts[idx] || 0;
    document.getElementById('progressLabel').textContent = '{{ t("current_letter") }}: ' + letter;
    document.getElementById('progressCount').textContent = count + '/' + TARGET_SAMPLES;
    document.getElementById('progressFill').style.width = Math.min(count / TARGET_SAMPLES * 100, 100) + '%';
    const btn = document.getElementById('recordBtn');
    btn.disabled = false;
    btn.textContent = '{{ t("btn_record_letter") }}'.replace('{letter}', letter);
    btn.className = 'record-btn';
    autoFrameCount = 0;
    document.getElementById('autoBar').style.width = '0%';
    showToast('{{ t("toast_selected") }}'.replace('{letter}', letter));
    document.getElementById('letterSelector').classList.add('collapsed');
}

// ===== تسجيل =====
async function recordSample(auto) {
    if (!selectedLetter || !currentLandmarks || isRecording) return;
    isRecording = true;
    const btn = document.getElementById('recordBtn');
    if (!auto) btn.disabled = true;

    try {
        const res = await fetch('/collect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ landmarks: currentLandmarks, label: selectedIdx })
        });
        const data = await res.json();

        if (data.success) {
            sampleCounts[selectedIdx] = (sampleCounts[selectedIdx] || 0) + 1;
            const count = sampleCounts[selectedIdx];
            document.getElementById('progressCount').textContent = count + '/' + TARGET_SAMPLES;
            document.getElementById('progressFill').style.width = Math.min(count / TARGET_SAMPLES * 100, 100) + '%';
            const countEl = document.getElementById('lcount_' + selectedIdx);
            if (countEl) countEl.textContent = count >= TARGET_SAMPLES ? '✓' : count;
            if (count >= TARGET_SAMPLES) {
                document.getElementById('lbtn_' + selectedIdx).classList.add('complete');
                showToast('{{ t("toast_completed") }}'.replace('{letter}', selectedLetter));
            }
            btn.className = 'record-btn success';
            btn.textContent = '{{ t("toast_recorded_done") }}'.replace('{count}', count);
            if (navigator.vibrate) navigator.vibrate(30);
            setTimeout(() => {
                btn.className = 'record-btn';
                btn.textContent = '{{ t("btn_record_letter") }}'.replace('{letter}', selectedLetter);
                btn.disabled = false;
                isRecording = false;
            }, auto ? 100 : 500);

        } else if (data.rejected) {
            // رسالة الرفض داخل الكاميرا
            showReject(data.error || '{{ t("toast_gesture_rejected") }}');
            btn.disabled = false;
            isRecording = false;
        } else {
            showToast((data.error || '{{ t("toast_record_failed") }}'));
            btn.disabled = false;
            isRecording = false;
        }
    } catch(e) {
        showToast('{{ t("toast_error") }}');
        btn.disabled = false;
        isRecording = false;
    }
}

function toggleAuto() {
    autoMode = !autoMode;
    const btn = document.getElementById('autoToggle');
    btn.className = autoMode ? 'auto-toggle active' : 'auto-toggle';
    btn.innerHTML = '<br>' + '{{ t("auto_mode") }}';
    showToast(autoMode ? '{{ t("auto_mode_enabled") }}' : '{{ t("auto_mode_disabled") }}');
    autoFrameCount = 0;
    document.getElementById('autoBar').style.width = '0%';
}

// ===== رسم اليد =====
function drawHand(landmarks, videoW, videoH) {
    overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

    const canvasW = overlayCanvas.width;
    const canvasH = overlayCanvas.height;
    const videoAspect = videoW / videoH;
    const canvasAspect = canvasW / canvasH;

    let renderW, renderH, offsetX = 0, offsetY = 0;
    if (videoAspect > canvasAspect) {
        renderW = canvasW;
        renderH = canvasW / videoAspect;
        offsetY = (canvasH - renderH) / 2;
    } else {
        renderH = canvasH;
        renderW = canvasH * videoAspect;
        offsetX = (canvasW - renderW) / 2;
    }

    const px = lm => lm.x * renderW + offsetX;
    const py = lm => lm.y * renderH + offsetY;

    const conns = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
                   [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
                   [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
    overlayCtx.strokeStyle = 'rgba(245,158,11,0.75)';
    overlayCtx.lineWidth = 2;
    conns.forEach(([a, b]) => {
        overlayCtx.beginPath();
        overlayCtx.moveTo(px(landmarks[a]), py(landmarks[a]));
        overlayCtx.lineTo(px(landmarks[b]), py(landmarks[b]));
        overlayCtx.stroke();
    });
    overlayCtx.fillStyle = '#f59e0b';
    landmarks.forEach(lm => {
        overlayCtx.beginPath();
        overlayCtx.arc(px(lm), py(lm), 3.5, 0, Math.PI * 2);
        overlayCtx.fill();
    });
}

// ===== Toast و Reject =====
let toastTimer = null;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

let rejectTimer = null;
function showReject(msg) {
    const el = document.getElementById('rejectMsg');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(rejectTimer);
    rejectTimer = setTimeout(() => el.classList.remove('show'), 2500);
    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
}

// ===== MediaPipe =====
function initMediaPipe() {
    document.getElementById('loadingSub').textContent = '{{ t("loading_mediapipe") }}';
    const hands = new Hands({
        locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f
    });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.5 });

    hands.onResults(results => {
        const w = video.videoWidth || overlayCanvas.width;
        const h = video.videoHeight || overlayCanvas.height;

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            drawHand(landmarks, w, h);

            const raw = [];
            landmarks.forEach(lm => raw.push(lm.x, lm.y));
            currentLandmarks = raw;

            document.getElementById('handStatus').textContent = '{{ t("hand_detected") }}';
            document.getElementById('handStatus').className = 'hand-status detected';

            if (autoMode && selectedLetter && !isRecording) {
                autoFrameCount++;
                document.getElementById('autoBar').style.width = Math.min(autoFrameCount / AUTO_CONFIRM_FRAMES * 100, 100) + '%';
                if (autoFrameCount >= AUTO_CONFIRM_FRAMES) {
                    autoFrameCount = 0;
                    document.getElementById('autoBar').style.width = '0%';
                    recordSample(true);
                }
            }
        } else {
            currentLandmarks = null;
            overlayCtx.clearRect(0, 0, w, h);
            document.getElementById('handStatus').textContent = '{{ t("waiting_for_hand_dots") }}';
            document.getElementById('handStatus').className = 'hand-status';
            if (autoMode) { autoFrameCount = 0; document.getElementById('autoBar').style.width = '0%'; }
        }
    });

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        document.getElementById('loadingSub').textContent = '{{ t("camera_browser_error") }}';
        console.error('Camera init failed: getUserMedia not supported');
        return;
    }

    const camera = new Camera(video, {
        onFrame: async () => {
            if (cameraWrap) {
                overlayCanvas.width = cameraWrap.clientWidth || (video.videoWidth || 640);
                overlayCanvas.height = cameraWrap.clientHeight || (video.videoHeight || 480);
            } else {
                overlayCanvas.width = video.videoWidth || 640;
                overlayCanvas.height = video.videoHeight || 480;
            }
            await hands.send({ image: video });
        },
        width: 640, height: 480
    });

    camera.start().then(() => {
        document.getElementById('loadingScreen').classList.add('hidden');
    }).catch((err) => {
        console.error('Failed to start camera', err);
        const cameraError = err?.message || err?.name || String(err);
        document.getElementById('loadingSub').textContent = `{{ t("camera_access_failed") }}: ${cameraError}`;
        showToast('{{ t("camera_access_failed") }}: ' + cameraError, 'error');
    });
}

buildLettersGrid();
loadCounts();
window.addEventListener('load', initMediaPipe);
</script>
</body>
</html>
