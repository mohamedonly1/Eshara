<!DOCTYPE html>
<html lang="{{ active_lang }}" dir="{{ 'rtl' if active_lang == 'ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ t('title_translate') }}</title>
    <link rel="stylesheet" href="/static/ishara-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:#0a0a0f; --surface:#13131a; --surface2:#1c1c28;
            --accent:#00d4aa; --accent2:#7c3aed; --warn:#f59e0b;
            --danger:#ef4444; --text:#f0f0f8; --text-dim:#6b7280;
            --radius:18px;
        }
        html, body {
            min-height: 100%;
            background: radial-gradient(circle at top, #111827 0%, #020617 55%, #020617 100%);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
        }
        .page-content {
            padding-top: 52px;
            max-width: 960px;
            margin: 0 auto;
            padding-bottom: 24px;
        }
        .inner {
            padding: 18px 16px 0;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr);
            gap: 16px;
        }
        @media (max-width: 800px) {
            .inner { grid-template-columns: minmax(0, 1fr); }
        }
        .card {
            background: rgba(19,19,26,0.96);
            border-radius: 20px;
            border: 1px solid rgba(148,163,184,0.15);
            padding: 16px 16px 14px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .text-input {
            width: 100%;
            min-height: 120px;
            max-height: 220px;
            resize: vertical;
            border-radius: 16px;
            border: 1px solid rgba(148,163,184,0.28);
            padding: 10px 12px;
            background: rgba(15,23,42,0.9);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            outline: none;
        }
        .text-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(34,197,147,0.7);
        }
        .input-actions {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .left-actions { display: flex; gap: 8px; align-items: center; }
        .btn {
            border-radius: 999px;
            border: none;
            padding: 8px 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-mic {
            background: rgba(37,99,235,0.15);
            color: #93c5fd;
            border: 1px solid rgba(59,130,246,0.4);
        }
        .btn-mic.listening {
            background: rgba(220,38,38,0.15);
            color: #fecaca;
            border-color: rgba(248,113,113,0.9);
            box-shadow: 0 0 0 1px rgba(248,113,113,0.6);
        }
        .btn-translate {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #020617;
            box-shadow: 0 0 20px rgba(16,185,129,0.4);
        }
        .btn-translate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-dim);
        }
        .speed-control span.label { white-space: nowrap; }
        .speed-control span.tag {
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(15,23,42,0.9);
            border: 1px solid rgba(148,163,184,0.35);
            font-size: 10px;
        }
        input[type=range].speed-slider {
            -webkit-appearance: none;
            width: 120px;
            height: 4px;
            border-radius: 2px;
            background: rgba(30,64,175,0.7);
            outline: none;
        }
        input[type=range].speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f9fafb;
            border: 2px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 0 0 2px rgba(34,197,147,0.5);
        }
        .hint { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
        .three-card { display: flex; flex-direction: column; gap: 10px; }
        .three-wrap {
            position: relative;
            background: radial-gradient(circle at top, #020617 0%, #020617 45%, #030712 100%);
            border-radius: 20px;
            border: 1px solid rgba(15,23,42,0.9);
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(15,23,42,0.9);
        }
        #threeContainer {
            width: 100%;
            height: 260px;
            min-height: 220px;
            position: relative;
        }
        @media (max-width: 800px) { #threeContainer { height: 260px; } }
        canvas#threeCanvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        .three-overlay-label {
            position: absolute;
            top: 10px;
            left: 14px;
            font-size: 11px;
            color: #9ca3af;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(15,23,42,0.85);
            border: 1px solid rgba(55,65,81,0.9);
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-dim);
        }
        .current-letter { display: flex; align-items: center; gap: 8px; }
        .letter-pill {
            min-width: 36px;
            height: 36px;
            border-radius: 999px;
            background: radial-gradient(circle at top, rgba(16,185,129,0.25), rgba(6,78,59,0.3));
            border: 1px solid rgba(16,185,129,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            color: #a7f3d0;
        }
        .progress-text { font-size: 12px; }
        .progress-bar-wrap {
            flex: 1;
            height: 4px;
            border-radius: 999px;
            background: rgba(31,41,55,0.9);
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.2s ease-out;
        }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: rgba(15,23,42,0.98);
            border-radius: 999px;
            padding: 7px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            border: 1px solid rgba(45,212,191,0.5);
            box-shadow: 0 18px 40px rgba(15,23,42,0.9);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.24s, transform 0.24s;
            z-index: 999;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { color: #fecaca; border-color: rgba(248,113,113,0.6); }
    </style>
</head>
<body>
{% include 'navbar.html' %}

<div class="page-content">
    <div class="inner">
        <div class="card">
            <div class="section-title"><span>{{ t('translate_input_title') }}</span></div>
            <textarea id="textInput" class="text-input" placeholder="{{ t('translate_input_placeholder') }}"></textarea>
            <div class="input-actions">
                <div class="left-actions">
                    <button id="micBtn" class="btn btn-mic" type="button">
                        <span>{{ t('translate_voice_btn') }}</span>
                    </button>
                    <div class="speed-control">
                        <span class="label">{{ t('translate_speed_label') }}:</span>
                        <span>{{ t('translate_speed_slow') }}</span>
                        <input id="speedSlider" class="speed-slider" type="range" min="1" max="3" step="1" value="2">
                        <span>{{ t('translate_speed_fast') }}</span>
                        <span id="speedTag" class="tag">{{ t('translate_speed_medium') }}</span>
                    </div>
                </div>
                <button id="translateBtn" class="btn btn-translate" type="button">
                    <span>{{ t('translate_btn') }}</span>
                </button>
            </div>
            <div class="hint">
                {{ t('translate_hint') }}
            </div>
        </div>

        <div class="three-card">
            <div class="three-wrap">
                <div class="three-overlay-label">{{ t('translate_canvas_label') }}</div>
                <div id="threeContainer">
                    <canvas id="threeCanvas"></canvas>
                </div>
            </div>
            <div class="card" style="padding:10px 12px;">
                <div class="status-row">
                    <div class="current-letter">
                        <span style="font-size:11px;color:var(--text-dim);">{{ t('current_letter') }}:</span>
                        <div id="currentLetterPill" class="letter-pill">ـ</div>
                    </div>
                    <div style="flex:1;display:flex;align-items:center;gap:8px;">
                        <div class="progress-bar-wrap">
                            <div id="progressBar" class="progress-bar"></div>
                        </div>
                        <div id="progressText" class="progress-text">0 / 0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/static/poses.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// ==== Toast ====
let toastTimer = null;
function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type === 'error' ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ==== Speed ====
const speedSlider = document.getElementById('speedSlider');
const speedTag    = document.getElementById('speedTag');
function updateSpeedTag() {
    const v = Number(speedSlider.value);
    speedTag.textContent = v === 1 ? '{{ t("translate_speed_slow") }}' : v === 2 ? '{{ t("translate_speed_medium") }}' : '{{ t("translate_speed_fast") }}';
}
speedSlider.addEventListener('input', updateSpeedTag);
updateSpeedTag();
function getLetterDelay() {
    const v = Number(speedSlider.value);
    return v === 1 ? 900 : v === 2 ? 600 : 300;
}

// ==== Three.js setup ====
const container = document.getElementById('threeContainer');
const canvas    = document.getElementById('threeCanvas');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020617);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
// ضبطنا الكاميرا زي المحرر بالظبط
camera.position.set(0, 0.5, 6.5);
camera.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0x38bdf8, 0x020617, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(2, 3, 4);
scene.add(dirLight);

// ==== Resize ====
function onResize() {
    const w = container.clientWidth;
    const h = container.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
}
onResize();
window.addEventListener('resize', onResize);

// ==== Render loop ====
function loop() {
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
}
loop();

// ==== Load model ====
let handBonesByName = {};
let handBoneBindQuat = {}; // لحفظ وضع الراحة
let handModelLoaded = false;
let handModel = null; // مرجع عام للموديل

// القيم الافتراضية لاتجاه الموديل
const DEFAULT_PITCH = 0.15;
const DEFAULT_YAW   = -0.55;

new THREE.GLTFLoader().load(
    "{{ url_for('static', filename='models/hand.glb') }}",
    (gltf) => {
        const model = gltf.scene;
        handModel = model;
        // ضبطنا الموديل ليكون مطابقاً للمحرر
        model.scale.setScalar(0.12);
        model.position.set(0, -0.8, 0);
        model.rotation.set(DEFAULT_PITCH, DEFAULT_YAW, 0);

        model.traverse(o => {
            if (o.isBone) {
                handBonesByName[o.name] = o;
                handBoneBindQuat[o.name] = o.quaternion.clone();
            }
        });

        scene.add(model);
        handModelLoaded = true;
    },
    null,
    (err) => {
        console.error('فشل تحميل الموديل:', err);
        showToast('{{ t("translate_load_model_failed") }}', 'error');
    }
);

// ==== تحويل بيانات الإحداثيات (3D Points) إلى دوران محلي للعظام باستخدام Inverse Kinematics ====
function getTargetLocalRotations(poseData) {
    const targets = {};
    const backupState = {};
    
    // 1. حفظ الوضع الحالي للموديل والعظام
    for (const b in handBonesByName) {
        backupState[b] = handBonesByName[b].quaternion.clone();
    }
    const backupGlobal = handModel.quaternion.clone(); // الاحتفاظ بالاتجاه العالمي الحالي

    // ملء كل العظام بوضع الراحة الافتراضي لضمان عدم تراكم التشوهات من الحروف السابقة
    for (const b in handBonesByName) {
        targets[b] = handBoneBindQuat[b].clone();
    }

    // هل البيانات بصيغة إحداثيات (Points) المكونة من 63 قيمة (21 نقطة × 3)؟
    if (!Array.isArray(poseData) || poseData.length !== 63) {
        if (typeof poseData === 'object' && !Array.isArray(poseData)) {
            for (const boneName in poseData) {
                if (boneName === 'global_rotation') continue;
                const r = poseData[boneName];
                const e = new THREE.Euler(r.x || 0, r.y || 0, r.z || 0, 'XYZ');
                const q = new THREE.Quaternion().setFromEuler(e);
                if (handBoneBindQuat[boneName]) {
                    targets[boneName] = handBoneBindQuat[boneName].clone().multiply(q);
                }
            }
            targets['_global_rotation'] = poseData['global_rotation'] || { x: 0.15, y: -0.55, z: 0 };
            return targets;
        }
        console.warn("تجاهل الوضعية: البيانات غير متوافقة مع نظام النقاط الجديد (63 قيمة).");
        return backupState;
    }

    // 2. إعادة المجسم بالكامل والعظام لوضع الراحة الفعلي (0,0,0) لتكون حسابات الـ IK مستقلة عن أي دوران حالي
    handModel.rotation.set(0, 0, 0);
    handModel.updateMatrixWorld(true);

    for (const b in handBonesByName) {
        handBonesByName[b].quaternion.copy(handBoneBindQuat[b]);
    }
    if (handBonesByName['radius_ulna']) {
        handBonesByName['radius_ulna'].updateMatrixWorld(true);
    }
    
    // حفظ الاتجاه العالمي للعظام في وضع الراحة (Bind Pose)
    const bindWorldQuats = {};
    for (const b in handBonesByName) {
        bindWorldQuats[b] = handBonesByName[b].getWorldQuaternion(new THREE.Quaternion());
    }

    // 3. تحويل النقاط من MediaPipe إلى Three.js
    // MediaPipe: X يمين, Y أسفل, Z عمق بعيد
    // Three.js: X يمين, Y أعلى, Z عمق قريب
    const lms = [];
    for(let i=0; i<21; i++) {
        lms.push(new THREE.Vector3(poseData[i*3], -poseData[i*3+1], -poseData[i*3+2]));
    }

    const BONE_SEGMENTS = [
        ['thumb_trapez',  0,  1], ['thumb_meta',    1,  2], ['thumb_prox',    2,  3], ['thumb_dist',    3,  4],
        // ['index_meta',    0,  5], 
        ['index_prox',    5,  6], ['index_midd',    6,  7], ['index_dist',    7,  8],
        // ['midd_meta',     0,  9], 
        ['midd_prox',     9, 10], ['midd_midd',    10, 11], ['midd_dist',    11, 12],
        // ['ring_meta',     0, 13], 
        ['ring_prox',    13, 14], ['ring_midd',    14, 15], ['ring_dist',    15, 16],
        // ['pinky_meta',    0, 17], 
        ['pinky_prox',   17, 18], ['pinky_midd',   18, 19], ['pinky_dist',   19, 20]
    ];

    // 4. توجيه جذر اليد (radius_ulna)
    const rootBone = handBonesByName['radius_ulna'];
    if (rootBone) {
        // Step 1: Align Y axis (Wrist to Middle MCP)
        const targetPalmY = lms[9].clone().sub(lms[0]).normalize();
        const currentRootY = new THREE.Vector3(0, 1, 0).applyQuaternion(rootBone.getWorldQuaternion(new THREE.Quaternion()));
        const deltaRootY = new THREE.Quaternion().setFromUnitVectors(currentRootY, targetPalmY);
        
        let rootWorldQ = rootBone.getWorldQuaternion(new THREE.Quaternion());
        rootWorldQ.premultiply(deltaRootY);
        
        const rootParentWorldQ = rootBone.parent.getWorldQuaternion(new THREE.Quaternion());
        rootBone.quaternion.copy(rootParentWorldQ.clone().invert().multiply(rootWorldQ));
        rootBone.updateMatrixWorld(true);

        // Step 2: Align X axis (Roll correction)
        let targetPalmX = lms[5].clone().sub(lms[17]).normalize();
        targetPalmX.projectOnPlane(targetPalmY).normalize();

        if (handBonesByName['index_prox'] && handBonesByName['pinky_prox']) {
            const currentIdx = new THREE.Vector3();
            handBonesByName['index_prox'].getWorldPosition(currentIdx);
            const currentPinky = new THREE.Vector3();
            handBonesByName['pinky_prox'].getWorldPosition(currentPinky);
            
            let currentPalmX = currentIdx.clone().sub(currentPinky).normalize();
            currentPalmX.projectOnPlane(targetPalmY).normalize();

            const deltaRootX = new THREE.Quaternion().setFromUnitVectors(currentPalmX, targetPalmX);
            
            rootWorldQ = rootBone.getWorldQuaternion(new THREE.Quaternion());
            rootWorldQ.premultiply(deltaRootX);
            rootBone.quaternion.copy(rootParentWorldQ.clone().invert().multiply(rootWorldQ));
            rootBone.updateMatrixWorld(true);
        }

        targets['radius_ulna'] = rootBone.quaternion.clone();
    }

    // 5. توجيه مفاصل الأصابع
    for(const seg of BONE_SEGMENTS) {
        const boneName = seg[0];
        const startIdx = seg[1];
        const endIdx = seg[2];
        const bone = handBonesByName[boneName];
        if(!bone) continue;

        const isThumb = boneName.startsWith('thumb');

        const targetDir = lms[endIdx].clone().sub(lms[startIdx]).normalize();
        if(targetDir.lengthSq() < 0.1) continue;

        const currentDir = new THREE.Vector3(0, 1, 0).applyQuaternion(bone.getWorldQuaternion(new THREE.Quaternion()));
        const deltaQ = new THREE.Quaternion().setFromUnitVectors(currentDir, targetDir);

        let worldQ = bone.getWorldQuaternion(new THREE.Quaternion());
        worldQ.premultiply(deltaQ);
        const parentWorldQ = bone.parent.getWorldQuaternion(new THREE.Quaternion());
        bone.quaternion.copy(parentWorldQ.clone().invert().multiply(worldQ));
        bone.updateMatrixWorld(true);

        // منع الالتواء (Corkscrew) للأصابع الأربعة عن طريق الحفاظ على محور الدوران الأصلي
        if (!isThumb && rootBone && bindWorldQuats[boneName] && bindWorldQuats['radius_ulna']) {
            // حساب الدوران الكلي للجذر مقارنة بوضع الراحة
            const rootDeltaQ = bindWorldQuats['radius_ulna'].clone().invert().multiply(rootBone.getWorldQuaternion(new THREE.Quaternion()));
            
            // المحور المرجعي للعظمة بناءً على وضع الراحة ملفوفاً بدوران الجذر
            const referenceX = new THREE.Vector3(1, 0, 0).applyQuaternion(bindWorldQuats[boneName]).applyQuaternion(rootDeltaQ);
            referenceX.projectOnPlane(targetDir).normalize();
            
            const boneX = new THREE.Vector3(1, 0, 0).applyQuaternion(bone.getWorldQuaternion(new THREE.Quaternion()));
            boneX.projectOnPlane(targetDir).normalize();

            const rollQ = new THREE.Quaternion().setFromUnitVectors(boneX, referenceX);
            worldQ = bone.getWorldQuaternion(new THREE.Quaternion());
            worldQ.premultiply(rollQ);
            bone.quaternion.copy(parentWorldQ.clone().invert().multiply(worldQ));
            bone.updateMatrixWorld(true);
        }

        targets[boneName] = bone.quaternion.clone();
    }

    // 6. استرجاع الوضع الأصلي لتبدأ منه الحركة بنعومة
    for (const b in backupState) {
        handBonesByName[b].quaternion.copy(backupState[b]);
    }
    handModel.quaternion.copy(backupGlobal); // استرجاع الاتجاه العالمي القديم
    handModel.updateMatrixWorld(true);

    targets['_global_rotation'] = { x: 0.15, y: -0.55, z: 0 };
    return targets;
}

// ==== دالة الانتقال الناعم (Smooth Transition) ====
function transitionToPose(letter, durationMs) {
    return new Promise((resolve) => {
        if (!handModelLoaded || typeof POSES === 'undefined' || !POSES[letter]) {
            resolve();
            return;
        }

        const poseData = POSES[letter];
        // الحصول على الزوايا المحلية الصحيحة بغض النظر عن مصدر الداتا
        const targetLocals = getTargetLocalRotations(poseData);
        
        const startTime = performance.now();
        const transitions = [];

        for (const boneName in targetLocals) {
            if (boneName === '_global_rotation') continue;
            const bone = handBonesByName[boneName];
            if (!bone) continue;
            transitions.push({ 
                bone: bone, 
                startQ: bone.quaternion.clone(), 
                targetQ: targetLocals[boneName] 
            });
        }

        const startGlobalQ = handModel.quaternion.clone();
        const tge = targetLocals['_global_rotation'] || { x: 0.15, y: -0.55, z: 0 };
        const targetGlobalQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(tge.x, tge.y, tge.z, 'XYZ'));

        // Animation Loop
        function animateFrame(currentTime) {
            const elapsed = currentTime - startTime;
            let t = elapsed / durationMs;
            if (t >= 1) t = 1;

            // Ease-in-out لحركة واقعية أكثر
            const easeT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

            transitions.forEach(trans => {
                trans.bone.quaternion.slerpQuaternions(trans.startQ, trans.targetQ, easeT);
            });
            
            handModel.quaternion.slerpQuaternions(startGlobalQ, targetGlobalQ, easeT);

            // تحديث جذري مرة واحدة
            if (handBonesByName['radius_ulna']) {
                handBonesByName['radius_ulna'].updateMatrixWorld(true);
            }

            if (t < 1) {
                requestAnimationFrame(animateFrame);
            } else {
                resolve();
            }
        }
        requestAnimationFrame(animateFrame);
    });
}

// ==== UI refs ====
const textInput         = document.getElementById('textInput');
const translateBtn      = document.getElementById('translateBtn');
const currentLetterPill = document.getElementById('currentLetterPill');
const progressText      = document.getElementById('progressText');
const progressBar       = document.getElementById('progressBar');

let activeSequence = [];
let currentIndex   = 0;
let playing        = false;

const MAP = { 'ا':'أ', 'إ':'أ', 'آ':'أ', 'ة':'ه', 'ى':'ي', 'ؤ':'و', 'ئ':'ي' };
function normalize(ch) { return MAP[ch] || ch; }

function buildSequence(text) {
    const seq = [];
    for (const ch of text) {
        if (ch === ' ') {
            if (seq.length > 0) seq.push(' ');
            continue;
        }
        const c = normalize(ch);
        if (typeof POSES !== 'undefined' && POSES[c]) seq.push(c);
    }
    while (seq.length > 0 && seq[seq.length - 1] === ' ') {
        seq.pop();
    }
    return seq;
}

function updateStatus() {
    if (!activeSequence.length) {
        currentLetterPill.textContent = 'ـ';
        progressText.textContent      = '0 / 0';
        progressBar.style.width       = '0%';
        return;
    }
    currentLetterPill.textContent = activeSequence[currentIndex];
    progressText.textContent      = (currentIndex + 1) + ' / ' + activeSequence.length;
    progressBar.style.width       = ((currentIndex + 1) / activeSequence.length * 100) + '%';
}

// ==== Play sequence ====
async function play() {
    playing = true;
    translateBtn.disabled = true;

    for (let i = 0; i < activeSequence.length; i++) {
        currentIndex = i;
        updateStatus();

        if (activeSequence[i] === ' ') {
            currentLetterPill.textContent = '␣';
            await new Promise(r => setTimeout(r, getLetterDelay()));
            continue;
        }

        const totalDelay = getLetterDelay(); 
        const animDuration = totalDelay * 0.7; 
        const holdDuration = totalDelay * 0.3; 

        // تحريك ناعم للحرف
        await transitionToPose(activeSequence[i], animDuration);
        
        // ثبات بسيط لتمكين المستخدم من رؤية الحرف
        await new Promise(r => setTimeout(r, holdDuration));
    }

    playing = false;
    translateBtn.disabled = false;
}

translateBtn.addEventListener('click', () => {
    if(playing) return;
    const text = textInput.value.trim();
    if (!text) { showToast('{{ t("toast_type_word_first") }}', 'error'); return; }

    activeSequence = buildSequence(text);
    if (!activeSequence.length) { showToast('{{ t("translate_no_supported_letters") }}', 'error'); return; }

    play();
});

// ==== Mic / Voice Recognition ====
const micBtn = document.getElementById('micBtn');
let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    
    const lang = "{{ active_lang }}";
    recognition.lang = lang === 'ar' ? 'ar-SA' : (lang === 'en' ? 'en-US' : lang);

    recognition.onstart = () => {
        micBtn.classList.add('listening');
        micBtn.querySelector('span').textContent = '{{ t("translate_voice_listening") }}';
    };

    recognition.onend = () => {
        micBtn.classList.remove('listening');
        micBtn.querySelector('span').textContent = '{{ t("translate_voice_btn") }}';
    };

    recognition.onerror = (event) => {
        console.error('Speech recognition error', event);
        micBtn.classList.remove('listening');
        micBtn.querySelector('span').textContent = '{{ t("translate_voice_btn") }}';
        showToast('{{ t("toast_error") }}', 'error');
    };

    recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        textInput.value = text;
        showToast('{{ t("translate_voice_success") }}');
    };

    micBtn.addEventListener('click', () => {
        if (micBtn.classList.contains('listening')) {
            recognition.stop();
        } else {
            recognition.start();
        }
    });
} else {
    micBtn.style.display = 'none';
}
</script>
