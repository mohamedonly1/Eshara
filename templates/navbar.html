<link rel="stylesheet" href="/static/ishara-theme.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1D9E75">

<nav class="navbar" id="navbar">
    <a href="/" style="text-decoration:none;flex-shrink:0;display:flex;align-items:center;gap:8px;">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
            <rect width="28" height="28" rx="7" fill="#1D9E75"/>
            <path d="M8 17 C5.5 15.5 5 11 7 9.5 C8.5 8.5 10 10 10 13" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M11 14 L11 7.5 C11 6.2 13 6.2 13 7.5 L13 14" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M14 14 L14 6.5 C14 5.2 16 5.2 16 6.5 L16 14" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M17 14 L17 7.5 C17 6.2 19 6.2 19 7.5 L19 14" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M20 14 L20 10 C20 8.7 22 8.7 22 10 L22 14" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M8 18.5 C8 21 20 21 20 18.5" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <circle cx="12" cy="7.5" r="1.2" fill="white"/>
            <circle cx="15" cy="6.5" r="1.2" fill="white"/>
            <circle cx="18" cy="7.5" r="1.2" fill="white"/>
            <circle cx="21" cy="10" r="1.2" fill="white"/>
        </svg>
        <span class="nav-logo">{{ t('app_name') }}</span>
    </a>

    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="28" height="28">
            <path fill="currentColor" d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2z"/>
        </svg>
    </button>

    <div class="nav-menu-wrapper" id="navMenuWrapper">
        <div class="nav-links" id="navLinks"></div>

        <div class="nav-user" id="navUser">
            
            <!-- مغير اللغات -->
            <div style="position: relative; display: flex; align-items: center; margin-left: 4px;">
                <select id="langSelector" onchange="changeLanguage(this.value)" style="background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 8px; font-family:'Cairo'; font-size:12px; font-weight:700; outline:none; cursor:pointer;">
                    <option value="ar">العربية (AR)</option>
                </select>
            </div>

            <button id="themeToggle" class="theme-toggle-btn" aria-label="{{ t('nav_theme_toggle') }}">
                <span class="icon-moon">&#9790;</span>
                <span class="icon-sun" style="display:none;">&#9788;</span>
            </button>

            <a href="/profile" style="display:flex;align-items:center;gap:6px;text-decoration:none;-webkit-tap-highlight-color:transparent;">
                <div class="nav-avatar" id="navAvatar">؟</div>
                <div class="nav-name" id="navName">...</div>
            </a>
            <button class="nav-logout" onclick="doLogout()">{{ t('nav_logout') }}</button>
        </div>
    </div>
</nav>
<style>
.navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: var(--surface) !important; /* استخدام المتغير بدلاً من الأبيض الثابت */
    border-bottom: 1px solid var(--border) !important;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
    z-index: 500;
    font-family: 'Cairo', sans-serif;
    box-shadow: var(--shadow-sm);
    transition: background 0.3s, border-color 0.3s;
}

.nav-logo {
    font-size: 16px;
    font-weight: 900;
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
}

.nav-menu-wrapper {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-right: 12px;
}

.nav-links {
    display: flex;
    gap: 2px;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
}
.nav-links::-webkit-scrollbar { display: none; }

.nav-link {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 11px;
    border-radius: 8px;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: var(--text-dim);
    border: none;
    background: transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
}
.nav-link:hover  { color: var(--accent); background: var(--accent-lt); }
.nav-link.active { color: var(--accent); background: var(--accent-lt); font-weight: 700; }

.nav-user {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.nav-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    flex-shrink: 0;
}

.nav-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.nav-logout {
    background: var(--danger-lt);
    border: 1px solid var(--border);
    color: var(--danger);
    padding: 5px 11px;
    border-radius: 20px;
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
}

.hamburger {
    display: none;
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    padding: 4px;
}

@media (max-width: 800px) {
    .hamburger { display: block; }
    .nav-menu-wrapper {
        position: absolute;
        top: 56px;
        left: 0; right: 0;
        background: var(--surface);
        flex-direction: column;
        align-items: stretch;
        padding: 16px;
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow-md);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-15px);
        transition: all 0.3s ease-in-out;
        z-index: 499;
    }
    .nav-menu-wrapper.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }
    .nav-links { flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .nav-link { padding: 12px 16px; background: var(--surface2); border-radius: 10px; }
    .nav-user { justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--border); }
}
</style>

<script>
// =============================================
// CSRF Protection Helper (SEC-01)
// Automatically attaches X-CSRFToken header to all non-GET fetch requests
// =============================================
(function() {
    function getCsrfToken() {
        const match = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : '';
    }
    const _originalFetch = window.fetch;
    window.fetch = function(url, options) {
        options = options || {};
        const method = (options.method || 'GET').toUpperCase();
        if (method !== 'GET' && method !== 'HEAD') {
            if (options.headers instanceof Headers) {
                if (!options.headers.has('X-CSRFToken')) options.headers.set('X-CSRFToken', getCsrfToken());
            } else {
                options.headers = options.headers || {};
                if (!options.headers['X-CSRFToken']) options.headers['X-CSRFToken'] = getCsrfToken();
            }
        }
        return _originalFetch.call(this, url, options);
    };
})();

    // نظام الوضع الليلي (Dark Mode)
// 1. فحص التفضيلات المحفوظة فوراً قبل تحميل الصفحة
const savedTheme = localStorage.getItem('ishara-theme');
if (savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
}

// 2. تشغيل الزرار بعد تحميل الـ DOM
document.addEventListener('DOMContentLoaded', () => {
    const themeBtn = document.getElementById('themeToggle');
    const iconMoon = document.querySelector('.icon-moon');
    const iconSun = document.querySelector('.icon-sun');

    if (themeBtn) {
        // ظبط شكل الأيقونة أول ما الصفحة تفتح
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
            iconMoon.style.display = 'none';
            iconSun.style.display = 'block';
        }

        // تفاعل الزرار عند الضغط
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('ishara-theme', 'light');
                iconMoon.style.display = 'block';
                iconSun.style.display = 'none';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('ishara-theme', 'dark');
                iconMoon.style.display = 'none';
                iconSun.style.display = 'block';
            }
        });
    }
});

// تشغيل زرار البرجر
document.addEventListener('DOMContentLoaded', () => {
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navMenuWrapper = document.getElementById('navMenuWrapper');
    
    if (hamburgerBtn && navMenuWrapper) {
        hamburgerBtn.addEventListener('click', () => {
            navMenuWrapper.classList.toggle('active');
        });
    }
});

async function initNavbar() {
    const res = await fetch('/auth/me');
    const user = await res.json();
    if (!user.logged_in) {
        if (!window._adminPage) window.location.href = '/login';
        return;
    }
    document.getElementById('navName').textContent = user.name;
    if (user.profile_pic) {
        document.getElementById('navAvatar').innerHTML = `<img src="${user.profile_pic}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;">`;
    } else {
        document.getElementById('navAvatar').textContent = user.name.charAt(0).toUpperCase();
    }
    const path = window.location.pathname;
const links = [
        { href: '/',             icon: '', label: '{{ t("nav_recognize") }}',       roles: ['user','admin'] },
        { href: '/translate',    icon: '', label: '{{ t("nav_translate") }}',        roles: ['user','admin'] },
        { href: '/collect-data', icon: '', label: '{{ t("nav_collect") }}', roles: ['user','admin'] },
        { href: '/profile',      icon: '', label: '{{ t("nav_profile") }}',        roles: ['user','admin'] },
        { href: '/pose-editor',  icon: '', label: '{{ t("nav_editor") }}',       roles: ['admin'] },
        { href: '/admin',        icon: '', label: '{{ t("nav_admin") }}',       roles: ['admin'], cls: 'admin-link' },
    ];
    const role = user.is_admin ? 'admin' : 'user';
    document.getElementById('navLinks').innerHTML = links
        .filter(l => l.roles.includes(role))
        .map(l => `
            <a href="${l.href}" class="nav-link ${l.cls||''} ${path===l.href?'active':''}">
                <span>${l.icon}</span><span>${l.label}</span>
            </a>`).join('');
}

async function doLogout() {
    await fetch('/auth/logout');
    window.location.href = '/login';
}

initNavbar();

async function loadLanguagesSelector() {
    try {
        const res = await fetch('/auth/languages');
        const data = await res.json();
        const select = document.getElementById('langSelector');
        if (!select) return;
        select.innerHTML = data.languages.map(lang => `
            <option value="${lang.code}" ${lang.code === data.active ? 'selected' : ''}>
                ${lang.name} (${lang.code.toUpperCase()})
            </option>
        `).join('');
    } catch (e) {
        console.error("Failed to load languages in selector", e);
    }
}

async function changeLanguage(langCode) {
    try {
        const res = await fetch('/auth/set-active-lang', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lang_code: langCode })
        });
        const data = await res.json();
        if (data.success) {
            window.location.reload();
        } else {
            alert(data.error || '{{ t("toast_error") }}');
        }
    } catch(e) {
        alert('{{ t("toast_network_error") }}');
    }
}

document.addEventListener('DOMContentLoaded', loadLanguagesSelector);

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/pwa/sw.js').catch(()=>{});
    });
}
</script>
