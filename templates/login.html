<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول — إشارة</title>
    <meta name="theme-color" content="#1D9E75">
    <link rel="manifest" href="/static/pwa/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/ishara-theme.css">
    <style>
        html, body {
            min-height: 100%;
            background: #F8FAF9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Cairo', sans-serif;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #FFFFFF;
            border-radius: 20px;
            padding: 36px 28px;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
        }

        /* ── اللوجو ── */
        .logo { text-align: center; margin-bottom: 28px; }

        .logo-mark {
            width: 64px; height: 64px;
            border-radius: 16px;
            background: #1D9E75;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 900;
            color: #1D9E75;
            margin-top: 2px;
        }

        .logo-sub {
            font-size: 13px;
            color: #6B7B74;
            margin-top: 4px;
        }

        /* ── التابز ── */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            background: #F1F5F3;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .tab {
            padding: 9px;
            border-radius: 8px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: #6B7B74;
            background: transparent;
        }
        .tab.active { background: #1D9E75; color: #fff; }

        /* ── الحقول ── */
        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 12px;
            color: #6B7B74;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            background: #F1F5F3;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            color: #2C2C2A;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: #1D9E75;
            box-shadow: 0 0 0 3px rgba(29,158,117,0.12);
        }
        input::placeholder { color: #A8BBB4; }

        /* ── الزر الرئيسي ── */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: #1D9E75;
            color: #fff;
            margin-top: 8px;
            transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(29,158,117,0.25);
        }
        .submit-btn:hover  { background: #0F6E56; }
        .submit-btn:active { transform: scale(0.98); }

        /* ── رسالة الخطأ ── */
        .error-msg {
            background: #FCEBEB;
            border: 1px solid rgba(163,45,45,0.2);
            color: #A32D2D;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.show { display: block; }

        /* ── رابط الأدمن ── */
        .admin-link { text-align: center; margin-top: 20px; }
        .admin-link a {
            font-size: 12px;
            color: #6B7B74;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 20px;
            transition: all 0.15s;
        }
        .admin-link a:hover { color: #1D9E75; background: #E1F5EE; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-mark">
            <svg width="36" height="36" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 17 C5.5 15.5 5 11 7 9.5 C8.5 8.5 10 10 10 13" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M11 14 L11 7.5 C11 6.2 13 6.2 13 7.5 L13 14" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M14 14 L14 6.5 C14 5.2 16 5.2 16 6.5 L16 14" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M17 14 L17 7.5 C17 6.2 19 6.2 19 7.5 L19 14" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M20 14 L20 10 C20 8.7 22 8.7 22 10 L22 14" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M8 18.5 C8 21 20 21 20 18.5" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                <circle cx="12" cy="7.5" r="1.3" fill="white"/>
                <circle cx="15" cy="6.5" r="1.3" fill="white"/>
                <circle cx="18" cy="7.5" r="1.3" fill="white"/>
                <circle cx="21" cy="10"  r="1.3" fill="white"/>
            </svg>
        </div>
        <div class="logo-title">إشارة</div>
        <div class="logo-sub">سجّل دخولك للمشاركة في جمع البيانات</div>
    </div>

    <div class="tabs">
        <button class="tab active" id="loginTab" onclick="showTab('login')">دخول</button>
        <button class="tab" id="registerTab" onclick="showTab('register')">حساب جديد</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <!-- Login Form -->
    <div id="loginForm">
        <div class="form-group">
            <label>الاسم</label>
            <input type="text" id="loginName" placeholder="أدخل اسمك" autocomplete="username">
        </div>
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password">
        </div>
        <button class="submit-btn" onclick="doLogin()">دخول ←</button>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display:none">
        <div class="form-group">
            <label>الاسم</label>
            <input type="text" id="regName" placeholder="اسمك بالعربي أو الإنجليزي">
        </div>
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="regPass" placeholder="اختر كلمة مرور">
        </div>
        <div class="form-group">
            <label>تأكيد كلمة المرور</label>
            <input type="password" id="regPass2" placeholder="أعد كتابة كلمة المرور">
        </div>
        <button class="submit-btn" onclick="doRegister()">إنشاء حساب</button>
    </div>

    <div class="admin-link">
        <a href="/admin">لوحة التحكم (أدمن)</a>
    </div>
</div>

<script>
function showTab(tab) {
    document.getElementById('loginForm').style.display    = tab === 'login'    ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('loginTab').className    = 'tab' + (tab === 'login'    ? ' active' : '');
    document.getElementById('registerTab').className = 'tab' + (tab === 'register' ? ' active' : '');
    hideError();
}

function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
}

function hideError() {
    document.getElementById('errorMsg').classList.remove('show');
}

async function doLogin() {
    const name = document.getElementById('loginName').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!name || !pass) { showError('من فضلك أدخل الاسم وكلمة المرور'); return; }
    const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, password: pass })
    });
    const data = await res.json();
    if (data.success) { window.location.href = '/collect-data'; }
    else { showError(data.error || 'خطأ في تسجيل الدخول'); }
}

async function doRegister() {
    const name  = document.getElementById('regName').value.trim();
    const pass  = document.getElementById('regPass').value;
    const pass2 = document.getElementById('regPass2').value;
    if (!name || !pass) { showError('من فضلك أدخل جميع البيانات'); return; }
    if (pass !== pass2) { showError('كلمات المرور غير متطابقة'); return; }
    if (pass.length < 4) { showError('كلمة المرور قصيرة جداً (4 أحرف على الأقل)'); return; }
    const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, password: pass })
    });
    const data = await res.json();
    if (data.success) { window.location.href = '/collect-data'; }
    else { showError(data.error || 'خطأ في إنشاء الحساب'); }
}

document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        if (document.getElementById('loginForm').style.display !== 'none') doLogin();
        else doRegister();
    }
});
</script>
</body>
</html>
