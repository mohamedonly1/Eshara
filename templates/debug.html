<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة فحص عظام اليد 3D</title>
    <link rel="stylesheet" href="/static/ishara-theme.css">
    <style>
        body { margin: 0; overflow: hidden; background: #222; color: white; font-family: Tahoma; }
        #ui { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; z-index: 10; }
        select, button { padding: 8px; margin: 5px; font-size: 14px; cursor: pointer; }
        .info { font-size: 12px; color: #aaa; margin-top: 10px; max-width: 300px; line-height: 1.5; }
    </style>
</head>
<body>

<div id="ui">
    <h3>أداة فحص الداتا (Debug)</h3>
    <label>اختر حرف من الداتا المسجلة بالبايثون:</label><br>
    <select id="letterSelect"></select><br><br>
    
    <button onclick="applyRaw()">1. تطبيق مباشر (Local)</button><br>
    <button onclick="applyWorldToLocal()">2. تطبيق بخوارزمية (World to Local)</button><br>
    <button onclick="resetHand()" style="color: red;">3. إعادة لوضع الراحة</button>
    
    <div class="info">
        <b>كيف تستخدم الأداة:</b><br>
        - استخدم الماوس للف الكاميرا (Click & Drag).<br>
        - عجلة الماوس للتقريب (Zoom).<br>
        - الخطوط الملونة هي الهيكل العظمي الحقيقي لليد.<br>
        - جرب الأزرار لترى كيف يتشوه الهيكل بسبب اختلاف المحاور.
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="/static/poses.js"></script>

<script>
    // 1. إعداد المشهد الأساسي
    const scene = new THREE.Scene();
    scene.add(new THREE.GridHelper(10, 50)); // شبكة أرضية
    scene.add(new THREE.AxesHelper(2));      // محاور X,Y,Z العالمية

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2, 2, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // أداة التحكم بالكاميرا بالماوس
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.update();

    // إضاءة
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(0, 5, 5);
    scene.add(dirLight);

    // 2. تحميل الموديل
    let handModel, skeletonHelper;
    let handBonesByName = {};
    let bindQuats = {};

    new THREE.GLTFLoader().load('/static/models/hand.glb', (gltf) => {
        handModel = gltf.scene;
        handModel.scale.set(0.5, 0.5, 0.5);
        handModel.position.set(0, 1, 0);

        handModel.traverse(child => {
            if (child.isBone) {
                handBonesByName[child.name] = child;
                bindQuats[child.name] = child.quaternion.clone(); // حفظ وضع الراحة
            }
        });

        scene.add(handModel);

        // Draw skeleton helper
        skeletonHelper = new THREE.SkeletonHelper(handModel);
        scene.add(skeletonHelper);
    });

    // 3. تعبئة قائمة الحروف من ملف poses.js
    const select = document.getElementById('letterSelect');
    if (typeof POSES !== 'undefined') {
        for (let letter in POSES) {
            let opt = document.createElement('option');
            opt.value = letter;
            opt.innerHTML = letter;
            select.appendChild(opt);
        }
    }

    // --- دوال التطبيق ---

    function resetHand() {
        for (let b in handBonesByName) {
            handBonesByName[b].quaternion.copy(bindQuats[b]);
            handBonesByName[b].updateMatrixWorld(true);
        }
    }

    // طريقة 1: تطبيق الداتا كأنها Local
    function applyRaw() {
        resetHand();
        const pose = POSES[select.value];
        for (let b in pose) {
            if (handBonesByName[b]) {
                handBonesByName[b].quaternion.set(pose[b][0], pose[b][1], pose[b][2], pose[b][3]);
                handBonesByName[b].updateMatrixWorld(true);
            }
        }
    }

    // طريقة 2: محاولة تحويلها من World لـ Local
    function applyWorldToLocal() {
        resetHand();
        const pose = POSES[select.value];
        const BONE_ORDER = [
            'radius_ulna',
            'thumb_trapez', 'thumb_meta', 'thumb_prox', 'thumb_dist',
            'index_meta',   'index_prox', 'index_midd', 'index_dist',
            'midd_meta',    'midd_prox',  'midd_midd',  'midd_dist',
            'ring_meta',    'ring_prox',  'ring_midd',  'ring_dist',
            'pinky_meta',   'pinky_prox', 'pinky_midd', 'pinky_dist',
        ];

        for (let boneName of BONE_ORDER) {
            let data = pose[boneName];
            let bone = handBonesByName[boneName];
            if (!bone || !data) continue;

            let boneWorldQ = new THREE.Quaternion(data[0], data[1], data[2], data[3]);
            let parent = bone.parent;

            if (parent && parent.isBone) {
                let parentWorldQ = new THREE.Quaternion();
                parent.getWorldQuaternion(parentWorldQ);
                let parentInv = parentWorldQ.clone().invert();
                bone.quaternion.copy(parentInv.multiply(boneWorldQ));
            } else {
                bone.quaternion.copy(boneWorldQ);
            }
            bone.updateMatrixWorld(true);
        }
    }

    // Render Loop
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
