<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إعادة تعيين كلمة المرور — إشارة</title>
    <link rel="stylesheet" href="/static/ishara-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        html, body {
            min-height: 100%;
            background: #F8FAF9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Cairo', sans-serif;
            transition: background 0.3s;
        }
        /* Dark theme support */
        [data-theme="dark"] html, [data-theme="dark"] body {
            background: #0a0a0f;
            color: #f0f0f8;
        }
        [data-theme="dark"] .card {
            background: #13131a;
            border-color: rgba(255,255,255,0.06);
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        [data-theme="dark"] .input-group input {
            background: #1c1c28;
            border-color: rgba(255,255,255,0.1);
            color: #f0f0f8;
        }
        [data-theme="dark"] .input-group input::placeholder {
            color: #5b6e64;
        }
        [data-theme="dark"] .input-group label {
            color: #a8bbb4;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #FFFFFF;
            border-radius: 20px;
            padding: 36px 28px;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            text-align: center;
            transition: all 0.3s ease;
        }

        .logo-mark {
            width: 64px; height: 64px;
            border-radius: 16px;
            background: #1D9E75;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
        }

        .title {
            font-size: 20px;
            font-weight: 900;
            color: #1D9E75;
            margin-bottom: 8px;
        }

        .description {
            font-size: 14px;
            color: #6B7B74;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        [data-theme="dark"] .description {
            color: #a8bbb4;
        }

        .input-group {
            text-align: right;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4A5568;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(0,0,0,0.08);
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            background: #F8FAF9;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }
        .input-group input:focus {
            border-color: #1D9E75;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(29,158,117,0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: #1D9E75;
            color: #fff;
            margin-bottom: 16px;
            transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(29,158,117,0.25);
        }
        .submit-btn:hover  { background: #0F6E56; }
        .submit-btn:active { transform: scale(0.98); }

        .error-msg {
            background: #FCEBEB;
            border: 1px solid rgba(163,45,45,0.2);
            color: #A32D2D;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: right;
            display: none;
        }
        .error-msg.show { display: block; }
        
        .success-msg {
            background: #EAFDF7;
            border: 1px solid rgba(29,158,117,0.2);
            color: #1D9E75;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: right;
            display: none;
        }
        .success-msg.show { display: block; }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 14px;
            color: #1D9E75;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo-mark">
        <svg width="36" height="36" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="28" height="28" rx="7" fill="#1D9E75"/>
            <path d="M14 6V14L19 17" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <!-- Step 1: Request Code -->
    <div id="stepRequest">
        <div class="title">نسيت كلمة المرور؟</div>
        <div class="description">
            أدخل اسم المستخدم أو البريد الإلكتروني الخاص بحسابك لإرسال رمز إعادة التعيين المكون من 6 أرقام.
        </div>

        <div class="error-msg" id="errorMsgRequest"></div>
        <div class="success-msg" id="successMsgRequest"></div>

        <div class="input-group">
            <label for="identifier">اسم المستخدم أو البريد الإلكتروني</label>
            <input type="text" id="identifier" placeholder="أدخل اسم الحساب أو بريدك" required>
        </div>

        <button class="submit-btn" onclick="requestResetCode()">إرسال رمز التحقق</button>
    </div>

    <!-- Step 2: Reset Password -->
    <div id="stepReset" class="hidden">
        <div class="title">إعادة تعيين كلمة المرور</div>
        <div class="description">
            تم إرسال رمز إعادة التعيين المكون من 6 أرقام إلى بريدك الإلكتروني المسجل.
        </div>

        <div class="error-msg" id="errorMsgReset"></div>
        <div class="success-msg" id="successMsgReset"></div>

        <div class="input-group">
            <label for="resetCode">رمز إعادة التعيين (6 أرقام)</label>
            <input type="text" id="resetCode" maxlength="6" placeholder="مثال: 123456" style="text-align: center; letter-spacing: 4px; font-weight: bold;" required>
        </div>

        <div class="input-group">
            <label for="newPassword">كلمة المرور الجديدة</label>
            <input type="password" id="newPassword" placeholder="اكتب كلمة المرور الجديدة" required>
        </div>

        <div class="input-group">
            <label for="newPasswordConfirm">تأكيد كلمة المرور الجديدة</label>
            <input type="password" id="newPasswordConfirm" placeholder="أعد كتابة كلمة المرور" required>
        </div>

        <button class="submit-btn" onclick="submitPasswordReset()">حفظ كلمة المرور الجديدة</button>
    </div>

    <a href="/login" class="back-link">العودة لتسجيل الدخول</a>
</div>

<script>
    // Theme setup
    const savedTheme = localStorage.getItem('ishara-theme');
    if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }

    let userIdentifier = '';

    function showError(step, msg) {
        const errEl = document.getElementById(step === 'request' ? 'errorMsgRequest' : 'errorMsgReset');
        const succEl = document.getElementById(step === 'request' ? 'successMsgRequest' : 'successMsgReset');
        succEl.classList.remove('show');
        errEl.textContent = msg;
        errEl.classList.add('show');
    }

    function showSuccess(step, msg) {
        const errEl = document.getElementById(step === 'request' ? 'errorMsgRequest' : 'errorMsgReset');
        const succEl = document.getElementById(step === 'request' ? 'successMsgRequest' : 'successMsgReset');
        errEl.classList.remove('show');
        succEl.textContent = msg;
        succEl.classList.add('show');
    }

    async function requestResetCode() {
        const input = document.getElementById('identifier').value.trim();
        if (!input) {
            showError('request', 'يرجى إدخال اسم المستخدم أو البريد الإلكتروني');
            return;
        }

        userIdentifier = input;

        try {
            const res = await fetch('/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: userIdentifier })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                showSuccess('request', 'تم إرسال رمز التحقق بنجاح! جاري تحويلك...');
                setTimeout(() => {
                    document.getElementById('stepRequest').classList.add('hidden');
                    document.getElementById('stepReset').classList.remove('hidden');
                }, 1500);
            } else {
                showError('request', data.error || 'حدث خطأ ما، يرجى المحاولة مجدداً');
            }
        } catch (e) {
            showError('request', 'حدث خطأ أثناء الاتصال بالخادم');
        }
    }

    async function submitPasswordReset() {
        const code = document.getElementById('resetCode').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;

        if (!code || code.length < 6) {
            showError('reset', 'يرجى إدخال رمز التحقق المكون من 6 أرقام كاملاً');
            return;
        }

        if (newPassword.length < 4) {
            showError('reset', 'كلمة المرور يجب ألا تقل عن 4 أحرف');
            return;
        }

        if (newPassword !== newPasswordConfirm) {
            showError('reset', 'كلمتا المرور غير متطابقتين');
            return;
        }

        try {
            const res = await fetch('/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    identifier: userIdentifier,
                    code: code,
                    new_password: newPassword
                })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                showSuccess('reset', 'تم تغيير كلمة المرور بنجاح! جاري تحويلك لتسجيل الدخول...');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                showError('reset', data.error || 'رمز التحقق غير صحيح أو منتهي الصلاحية');
            }
        } catch (e) {
            showError('reset', 'حدث خطأ أثناء الاتصال بالخادم');
        }
    }
</script>
</body>
</html>
