<!DOCTYPE html>
<html lang="{{ active_lang }}" dir="{{ 'rtl' if active_lang == 'ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ t('title_forgot_password') }}</title>
    <link rel="stylesheet" href="/static/ishara-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        html, body {
            min-height: 100%;
            background: #F8FAF9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Cairo', sans-serif;
            transition: background 0.3s;
        }
        /* Dark theme support */
        [data-theme="dark"] html, [data-theme="dark"] body {
            background: #0a0a0f;
            color: #f0f0f8;
        }
        [data-theme="dark"] .card {
            background: #13131a;
            border-color: rgba(255,255,255,0.06);
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        [data-theme="dark"] .input-group input {
            background: #1c1c28;
            border-color: rgba(255,255,255,0.1);
            color: #f0f0f8;
        }
        [data-theme="dark"] .input-group input::placeholder {
            color: #5b6e64;
        }
        [data-theme="dark"] .input-group label {
            color: #a8bbb4;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #FFFFFF;
            border-radius: 20px;
            padding: 36px 28px;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            text-align: center;
            transition: all 0.3s ease;
        }

        .logo-mark {
            width: 64px; height: 64px;
            border-radius: 16px;
            background: #1D9E75;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
        }

        .title {
            font-size: 20px;
            font-weight: 900;
            color: #1D9E75;
            margin-bottom: 8px;
        }

        .description {
            font-size: 14px;
            color: #6B7B74;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        [data-theme="dark"] .description {
            color: #a8bbb4;
        }

        .input-group {
            text-align: start;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4A5568;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(0,0,0,0.08);
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            background: #F8FAF9;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }
        .input-group input:focus {
            border-color: #1D9E75;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(29,158,117,0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: #1D9E75;
            color: #fff;
            margin-bottom: 16px;
            transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(29,158,117,0.25);
        }
        .submit-btn:hover  { background: #0F6E56; }
        .submit-btn:active { transform: scale(0.98); }

        .error-msg {
            background: #FCEBEB;
            border: 1px solid rgba(163,45,45,0.2);
            color: #A32D2D;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: start;
            display: none;
        }
        .error-msg.show { display: block; }
        
        .success-msg {
            background: #EAFDF7;
            border: 1px solid rgba(29,158,117,0.2);
            color: #1D9E75;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: start;
            display: none;
        }
        .success-msg.show { display: block; }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 14px;
            color: #1D9E75;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo-mark">
        <svg width="36" height="36" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="28" height="28" rx="7" fill="#1D9E75"/>
            <path d="M14 6V14L19 17" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <!-- Step 1: Request Code -->
    <div id="stepRequest">
        <div class="title">{{ t('forgot_password_title') }}</div>
        <div class="description">
            {{ t('forgot_password_desc') }}
        </div>

        <div class="error-msg" id="errorMsgRequest"></div>
        <div class="success-msg" id="successMsgRequest"></div>

        <div class="input-group">
            <label for="identifier">{{ t('forgot_password_identifier_label') }}</label>
            <input type="text" id="identifier" placeholder="{{ t('forgot_password_identifier_placeholder') }}" required>
        </div>

        <button class="submit-btn" onclick="requestResetCode()">{{ t('forgot_password_send_btn') }}</button>
    </div>

    <!-- Step 2: Reset Password -->
    <div id="stepReset" class="hidden">
        <div class="title">{{ t('forgot_password_reset_title') }}</div>
        <div class="description">
            {{ t('forgot_password_reset_desc') }}
        </div>

        <div class="error-msg" id="errorMsgReset"></div>
        <div class="success-msg" id="successMsgReset"></div>

        <div class="input-group">
            <label for="resetCode">{{ t('forgot_password_code_label') }}</label>
            <input type="text" id="resetCode" maxlength="6" placeholder="{{ t('forgot_password_code_placeholder') }}" style="text-align: center; letter-spacing: 4px; font-weight: bold;" required>
        </div>

        <div class="input-group">
            <label for="newPassword">{{ t('forgot_password_new_pass_label') }}</label>
            <input type="password" id="newPassword" placeholder="{{ t('forgot_password_new_pass_placeholder') }}" required>
        </div>

        <div class="input-group">
            <label for="newPasswordConfirm">{{ t('reg_pass_confirm_label') }}</label>
            <input type="password" id="newPasswordConfirm" placeholder="{{ t('reg_pass_confirm_placeholder') }}" required>
        </div>

        <button class="submit-btn" onclick="submitPasswordReset()">{{ t('forgot_password_reset_btn') }}</button>
    </div>

    <a href="/login" class="back-link">{{ t('forgot_password_back_link') }}</a>
</div>

<script>
// =========================================================================
// 1. نظام حماية الموقع التلقائي (CSRF Protection Helper - SEC-01)
// =========================================================================
(function() {
    /**
     * وظيفة هذه الدالة التلقائية هي تتبع وتغليف دالة Fetch الافتراضية بالمتصفح.
     * تقوم بفحص أي طلب إرسال بيانات (POST/PUT/DELETE) وتدرج رمز الـ CSRF 
     * تلقائياً في الترويسات لحماية الجلسة من هجمات الاختراقات.
     */
    function getCsrfToken() {
        const match = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : '';
    }
    const _originalFetch = window.fetch;
    window.fetch = function(url, options) {
        options = options || {};
        const method = (options.method || 'GET').toUpperCase();
        if (method !== 'GET' && method !== 'HEAD') {
            if (options.headers instanceof Headers) {
                if (!options.headers.has('X-CSRFToken')) options.headers.set('X-CSRFToken', getCsrfToken());
            } else {
                options.headers = options.headers || {};
                if (!options.headers['X-CSRFToken']) options.headers['X-CSRFToken'] = getCsrfToken();
            }
        }
        return _originalFetch.call(this, url, options);
    };
})();

    // تهيئة الوضع الليلي بناء على تفضيلات المستخدم
    const savedTheme = localStorage.getItem('ishara-theme');
    if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }

    let userIdentifier = ''; // متغير لحفظ اسم المستخدم أو بريده الإلكتروني مؤقتاً بين خطوات استرجاع الحساب

    // =========================================================================
    // 2. دوال عرض التنبيهات والأخطاء لكل خطوة
    // =========================================================================
    function showError(step, msg) {
        /** إظهار رسالة الخطأ باللون الأحمر للخطوة المحددة */
        const errEl = document.getElementById(step === 'request' ? 'errorMsgRequest' : 'errorMsgReset');
        const succEl = document.getElementById(step === 'request' ? 'successMsgRequest' : 'successMsgReset');
        succEl.classList.remove('show');
        errEl.textContent = msg;
        errEl.classList.add('show');
    }

    function showSuccess(step, msg) {
        /** إظهار رسالة النجاح باللون الأخضر للخطوة المحددة */
        const errEl = document.getElementById(step === 'request' ? 'errorMsgRequest' : 'errorMsgReset');
        const succEl = document.getElementById(step === 'request' ? 'successMsgRequest' : 'successMsgReset');
        errEl.classList.remove('show');
        succEl.textContent = msg;
        succEl.classList.add('show');
    }

    // =========================================================================
    // 3. الخطوة الأولى: طلب رمز التحقق (Request OTP Code)
    // =========================================================================
    async function requestResetCode() {
        const input = document.getElementById('identifier').value.trim();
        if (!input) {
            showError('request', '{{ t("forgot_password_fill_all_fields") }}');
            return;
        }

        userIdentifier = input;

        try {
            const res = await fetch('/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: userIdentifier })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                showSuccess('request', '{{ t("forgot_password_success_msg") }}');
                // بعد ثانية ونصف، نقوم بإخفاء الخطوة الأولى وإظهار حقل كتابة الرمز وكلمة المرور الجديدة
                setTimeout(() => {
                    document.getElementById('stepRequest').classList.add('hidden');
                    document.getElementById('stepReset').classList.remove('hidden');
                }, 1500);
            } else {
                showError('request', data.error || '{{ t("error_login_failed") }}');
            }
        } catch (e) {
            showError('request', '{{ t("toast_network_error") }}');
        }
    }

    // =========================================================================
    // 4. الخطوة الثانية: إدخال الرمز و تعيين كلمة المرور الجديدة
    // =========================================================================
    async function submitPasswordReset() {
        const code = document.getElementById('resetCode').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;

        // التحقق من طول الرمز و المدخلات يدوياً قبل الإرسال للسيرفر
        if (!code || code.length < 6) {
            showError('reset', '{{ t("verify_email_empty_code") }}');
            return;
        }
        if (newPassword.length < 4) {
            showError('reset', '{{ t("forgot_password_pass_too_short") }}');
            return;
        }
        if (newPassword !== newPasswordConfirm) {
            showError('reset', '{{ t("error_passwords_mismatch") }}');
            return;
        }

        try {
            const res = await fetch('/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    identifier: userIdentifier,
                    code: code,
                    new_password: newPassword
                })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                showSuccess('reset', '{{ t("forgot_password_success_msg") }}');
                // توجيه المستخدم لصفحة تسجيل الدخول فور انتهاء الحفظ بنجاح
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                showError('reset', data.error || '{{ t("verify_email_code_invalid") }}');
            }
        } catch (e) {
            showError('reset', '{{ t("toast_network_error") }}');
        }
    }
</script>
</body>
</html>
